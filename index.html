<html><head><base href="https://example.com/"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Telefonica Visitas</title><style>body {font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;margin: 0;padding: 0;display: flex;justify-content: space-evenly;align-items: center;height: 100vh;background-color: #ECE5DD;}.chat-window {width: 360px;height: 640px;border: 1px solid #ccc;background-color: #fff;box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);display: flex;flex-direction: column;overflow: hidden;}.chat-header {background-color: #075E54;color: white;padding: 10px;display: flex;align-items: center;justify-content: space-between;gap: 10px;}.chat-header-text {font-weight: bold;}.chat-avatar {width: 40px;height: 40px;border-radius: 50%;background-color: white;cursor: pointer;}.chat-messages {flex-grow: 1;padding: 15px;overflow-y: auto;background-color: #E5DDD5;display: flex;flex-direction: column;gap: 10px;max-height: 500px;}.chat-input {padding: 10px;display: flex;justify-content: center;align-items: center;background-color: #f7f7f7;border-top: 1px solid #ccc;}button {background-color: #25D366;color: white;border: none;padding: 10px;cursor: pointer;border-radius: 20px;margin: 5px;}button:hover {background-color: #1DA851;}.hidden {display: none;}.message-container {margin-bottom: 15px;background-color: white;padding: 10px;border-radius: 5px;position: relative;max-width: 80%;word-wrap: break-word;}.system-message {background-color: #DCF8C6;align-self: flex-start;}.user-message {align-self: flex-end;background-color: #CFCFCF;}.btn-horizontal {display: flex;gap: 5px;justify-content: center;flex-wrap: wrap;}.chat-footer {font-size: 12px;color: gray;text-align: center;padding: 10px;background-color: #f0f0f0;}.reset-button {background-color: #FF0000;color: white;font-weight: bold;}.file-input {display: none;}</style></head><body><div class="chat-window"><div class="chat-header"><img src="https://via.placeholder.com/40" alt="avatar" class="chat-avatar" id="chat-avatar"/><span class="chat-header-text">Telefonica Visitas</span><button onclick="document.getElementById('file-input').click()">Cambiar Icono</button><input type="file" id="file-input" class="file-input" accept="image/*" onchange="changeAvatar(event)" style="display: none"></div><div class="chat-messages" id="chat-messages"><div class="message-container system-message"><p><strong>Notificación:</strong> Tienes una visita programada para el <span id="initial-date"></span>.</p><div class="btn-horizontal"><button onclick="confirmAppointment()">Confirmar</button><button onclick="rescheduleAppointment()">Reprogramar</button></div></div></div><div class="chat-footer">Simulación de interfaz de WhatsApp Web<button class="reset-button" onclick="resetChat()">Reiniciar</button></div></div><div class="chat-window"><div class="chat-header"><img src="https://via.placeholder.com/40" alt="avatar" class="chat-avatar" id="report-avatar"/><span class="chat-header-text">Telefonica Tecnicos</span><button onclick="document.getElementById('file-input2').click()">Cambiar Icono</button><input type="file" id="file-input2" class="file-input" accept="image/*" onchange="changeReportAvatar(event)" style="display: none"></div><div class="chat-messages" id="report-messages"><div class="message-container system-message"><p>Hola [Nombre del técnico]. Entendemos que la visita programada no se pudo realizar. Por favor, indícanos los detalles para registrar el motivo.</p><div class="btn-horizontal"><button onclick="selectReason('Cliente no estaba presente')">Cliente no estaba presente</button><button onclick="selectReason('Dirección incorrecta')">Dirección incorrecta</button><button onclick="selectReason('Cliente rechazó el servicio')">Cliente rechazó el servicio</button><button onclick="selectReason('Problema técnico en el área')">Problema técnico en el área</button><button onclick="selectReason('Otro motivo')">Otro motivo</button></div></div></div><div class="chat-footer">Flujo de Mensajería<button class="reset-button" onclick="resetReport()">Reiniciar Interacción</button></div></div><script>function getRandomDate() {const today = new Date();const randomDays = Math.floor(Math.random() * 3) + 1;return new Date(today.setDate(today.getDate() + randomDays));}function formatDate(date) {const day = date.getDate().toString().padStart(2, '0');const month = (date.getMonth() + 1).toString().padStart(2, '0');const year = date.getFullYear();return `${day}/${month}/${year}`;}let initialDate = getRandomDate();document.getElementById('initial-date').innerText = formatDate(initialDate);function confirmAppointment() {const confirmationMessage = document.createElement('div');confirmationMessage.classList.add('message-container', 'user-message');confirmationMessage.innerHTML = `<p>Su cita ha sido confirmada para el <span>${formatDate(initialDate)}</span>. Esté pendiente de la llegada del técnico.</p>`;document.getElementById('chat-messages').appendChild(confirmationMessage);document.getElementById('chat-messages').scrollTop = document.getElementById('chat-messages').scrollHeight;askForAdditionalRequest();removeButtonContainer();}function rescheduleAppointment() {const rescheduleOptions = document.createElement('div');rescheduleOptions.classList.add('message-container', 'user-message');rescheduleOptions.innerHTML = `<p>Seleccione la fecha y franja horaria para reprogramar:</p>`;const rescheduleStart = new Date(initialDate);for (let i = 1; i <= 5; i++) {const optionDate = new Date(rescheduleStart);optionDate.setDate(rescheduleStart.getDate() + i + 3);const amButton = createTimeSlotButton(optionDate, "08:00 - 12:00");const pmButton = createTimeSlotButton(optionDate, "14:00 - 18:00");rescheduleOptions.appendChild(amButton);rescheduleOptions.appendChild(pmButton);}document.getElementById('chat-messages').appendChild(rescheduleOptions);document.getElementById('chat-messages').scrollTop = document.getElementById('chat-messages').scrollHeight;removeButtonContainer();}function createTimeSlotButton(date, timeSlot) {const button = document.createElement('button');button.innerText = `${formatDate(date)} ${timeSlot}`;button.onclick = () => selectNewAppointment(date, timeSlot);return button;}function selectNewAppointment(date, timeSlot) {const rescheduledMessage = document.createElement('div');rescheduledMessage.classList.add('message-container', 'system-message');rescheduledMessage.innerHTML = `<p>Su cita ha sido reprogramada para el <span>${formatDate(date)}</span> en la franja ${timeSlot}. Esté pendiente de la llegada del técnico.</p>`;document.getElementById('chat-messages').appendChild(rescheduledMessage);document.getElementById('chat-messages').scrollTop = document.getElementById('chat-messages').scrollHeight;askForAdditionalRequest();}function removeButtonContainer() {const buttonContainers = document.querySelectorAll('.btn-horizontal');buttonContainers.forEach(container => container.remove());}function resetChat() {document.getElementById('chat-messages').innerHTML = `<div class="message-container system-message"><p><strong>Notificación:</strong> Tienes una visita programada para el <span id="initial-date"></span>.</p><div class="btn-horizontal"><button onclick="confirmAppointment()">Confirmar</button><button onclick="rescheduleAppointment()">Reprogramar</button></div></div>`;initialDate = getRandomDate();document.getElementById('initial-date').innerText = formatDate(initialDate);}function resetReport() {reportMessages.innerHTML = `<div class="message-container system-message"><p>Hola [Nombre del técnico]. Entendemos que la visita programada no se pudo realizar. Por favor, indícanos los detalles para registrar el motivo.</p><div class="btn-horizontal"><button onclick="selectReason('Cliente no estaba presente')">Cliente no estaba presente</button><button onclick="selectReason('Dirección incorrecta')">Dirección incorrecta</button><button onclick="selectReason('Cliente rechazó el servicio')">Cliente rechazó el servicio</button><button onclick="selectReason('Problema técnico en el área')">Problema técnico en el área</button><button onclick="selectReason('Otro motivo')">Otro motivo</button></div></div>`;}function askForAdditionalRequest() {const additionalRequestMessage = document.createElement('div');additionalRequestMessage.classList.add('message-container', 'system-message');additionalRequestMessage.innerHTML = `<p>¿Tiene algún requerimiento adicional? <span>Sí</span> o <span>No</span></p>`;const yesButton = document.createElement('button');yesButton.innerText = "Sí";yesButton.onclick = simulateTransferToAdvisor;additionalRequestMessage.appendChild(yesButton);const noButton = document.createElement('button');noButton.innerText = "No";noButton.onclick = finalizeInteraction;additionalRequestMessage.appendChild(noButton);document.getElementById('chat-messages').appendChild(additionalRequestMessage);document.getElementById('chat-messages').scrollTop = document.getElementById('chat-messages').scrollHeight;}function simulateTransferToAdvisor() {const transferMessage = document.createElement('div');transferMessage.classList.add('message-container', 'system-message');transferMessage.innerHTML = `<p>Estamos transfiriendo su solicitud a un asesor. Por favor, espere.</p>`;document.getElementById('chat-messages').appendChild(transferMessage);document.getElementById('chat-messages').scrollTop = document.getElementById('chat-messages').scrollHeight;setTimeout(() => {const advisorMessage = document.createElement('div');advisorMessage.classList.add('message-container', 'system-message');advisorMessage.innerHTML = `<p>Buenas tardes, habla Diego Baron de Movistar. ¿En qué puedo ayudarle?</p>`;document.getElementById('chat-messages').appendChild(advisorMessage);document.getElementById('chat-messages').scrollTop = document.getElementById('chat-messages').scrollHeight;}, 5000);}function finalizeInteraction() {const farewellMessage = document.createElement('div');farewellMessage.classList.add('message-container', 'system-message');farewellMessage.innerHTML = `<p>Gracias por utilizar nuestro servicio. ¡Que tenga un buen día!</p>`;document.getElementById('chat-messages').appendChild(farewellMessage);document.getElementById('chat-messages').scrollTop = document.getElementById('chat-messages').scrollHeight;}function changeAvatar(event) {const file = event.target.files[0];if (file) {const reader = new FileReader();reader.onload = function(e) {const avatar = document.getElementById('chat-avatar');if(avatar) avatar.src = e.target.result;};reader.readAsDataURL(file);}}function changeReportAvatar(event) {const file = event.target.files[0];if (file) {const reader = new FileReader();reader.onload = function(e) {const avatar = document.getElementById('report-avatar');if(avatar) avatar.src = e.target.result;};reader.readAsDataURL(file);}}const reportMessages = document.getElementById('report-messages');let selectedReason = '';let additionalComment = '';function selectReason(reason) {selectedReason = reason;const reasonSelectedMessage = document.createElement('div');reasonSelectedMessage.classList.add('message-container', 'user-message');reasonSelectedMessage.innerHTML = `<p>Has indicado: ${reason}. ¿Deseas agregar algún comentario adicional?</p>`;const yesButton = document.createElement('button');yesButton.innerText = "Sí, agregar comentario";yesButton.onclick = promptForComment;reasonSelectedMessage.appendChild(yesButton);const noButton = document.createElement('button');noButton.innerText = "No, continuar";noButton.onclick = confirmReport;reasonSelectedMessage.appendChild(noButton);reportMessages.appendChild(reasonSelectedMessage);reportMessages.scrollTop = reportMessages.scrollHeight;}function promptForComment() {const commentMessage = document.createElement('div');commentMessage.classList.add('message-container', 'system-message');commentMessage.innerHTML = `<p>Por favor, escribe tu comentario adicional.</p>`;const commentInput = document.createElement('input');commentInput.type = "text";commentInput.onchange = (e) => {additionalComment = e.target.value;};commentMessage.appendChild(commentInput);const continueButton = document.createElement('button');continueButton.innerText = "Continuar";continueButton.onclick = confirmReport;commentMessage.appendChild(continueButton);reportMessages.appendChild(commentMessage);reportMessages.scrollTop = reportMessages.scrollHeight;}function confirmReport() {const confirmationMessage = document.createElement('div');confirmationMessage.classList.add('message-container', 'system-message');confirmationMessage.innerHTML = `<p>Gracias. Hemos registrado lo siguiente:<br>Motivo: ${selectedReason}<br>Comentario adicional: ${additionalComment}<br>¿Deseas confirmar el reporte?</p>`;const confirmButton = document.createElement('button');confirmButton.innerText = "Confirmar y enviar";confirmButton.onclick = requestPhotoEvidence;confirmationMessage.appendChild(confirmButton);const cancelButton = document.createElement('button');cancelButton.innerText = "Cancelar";cancelButton.onclick = cancelReport;confirmationMessage.appendChild(cancelButton);reportMessages.appendChild(confirmationMessage);reportMessages.scrollTop = reportMessages.scrollHeight;}function requestPhotoEvidence() {const evidenceMessage = document.createElement('div');evidenceMessage.classList.add('message-container', 'system-message');evidenceMessage.innerHTML = `<p>Por favor, sube una foto de la evidencia que capture la dirección de la vivienda.</p>`;const fileInput = document.createElement('input');fileInput.type = "file";fileInput.accept = "image/*";fileInput.style.marginTop = '10px';fileInput.onchange = function(event) {previewImage(event, evidenceMessage);};evidenceMessage.appendChild(fileInput);const confirmButton = document.createElement('button');confirmButton.innerText = "Enviar";confirmButton.onclick = sendReport;confirmButton.style.display = 'none';evidenceMessage.appendChild(confirmButton);reportMessages.appendChild(evidenceMessage);reportMessages.scrollTop = reportMessages.scrollHeight;}function previewImage(event, evidenceMessage) {const file = event.target.files[0];if (file) {const reader = new FileReader();reader.onload = function(e) {const imgPreview = document.createElement('img');imgPreview.src = e.target.result;imgPreview.alt = "Preview de la imagen cargada";imgPreview.style.maxWidth = '100%';imgPreview.style.borderRadius = '5px';imgPreview.style.marginTop = '10px';evidenceMessage.insertBefore(imgPreview, evidenceMessage.children[2]);evidenceMessage.querySelector('button').style.display = 'inline-block';};reader.readAsDataURL(file);}}function sendReport() {const sentMessage = document.createElement('div');sentMessage.classList.add('message-container', 'system-message');sentMessage.innerHTML = `<p>Tu reporte ha sido enviado con éxito. Gracias por mantenernos informados. ¡Buen día!</p>`;reportMessages.appendChild(sentMessage);reportMessages.scrollTop = reportMessages.scrollHeight;}function cancelReport() {const cancelMessage = document.createElement('div');cancelMessage.classList.add('message-container', 'system-message');cancelMessage.innerHTML = `<p>El reporte ha sido cancelado. No se han realizado modificaciones.</p>`;reportMessages.appendChild(cancelMessage);reportMessages.scrollTop = reportMessages.scrollHeight;}</script></body></html>
